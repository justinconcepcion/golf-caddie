spring.application.name=golf-caddie

# In-memory H2 for the MVP slice (swap to Postgres + Flyway once the loop is proven)
spring.datasource.url=jdbc:h2:mem:golfcaddie;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Claude proxy. API key is read server-side only; never expose it to the client.
golfcaddie.claude.api-key=${ANTHROPIC_API_KEY:}
golfcaddie.claude.model=claude-haiku-4-5
golfcaddie.claude.max-tokens=512
